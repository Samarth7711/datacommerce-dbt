name: 'analytics'
version: '1.0.0'
config-version: 2

profile: 'analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "{{ set_query_tag() }}"

models:
  analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
      +transient: true
      +snowflake_warehouse: DEV_WH
